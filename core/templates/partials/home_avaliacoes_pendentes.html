<div class="content-panel h-100">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h3 class="h6 mb-0">Avaliacoes de eficácia pendentes</h3>
    <span class="badge bg-light text-dark">{{ pendencias_avaliacoes|default_if_none:""|length }}</span>
  </div>
  <div class="exam-question-list pending-list">
    {% for pasta in pendencias_avaliacoes %}
    <article class="exam-question-card">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
          <div class="fw-semibold">{{ pasta.nome }}</div>
          <div class="text-muted small">Responsavel: {{ pasta.created_by.first_name }} {{ pasta.created_by.last_name }}</div>
        </div>
        <a href="{% url 'detail-pasta' pasta.pk %}" class="btn btn-cemag btn-sm">Responder</a>
      </div>
    </article>
    {% empty %}
    <p class="text-muted small mb-0">Nenhuma avaliacao pendente.</p>
    {% endfor %}
  </div>
</div>
